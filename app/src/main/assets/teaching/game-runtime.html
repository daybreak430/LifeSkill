<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' blob:; worker-src blob:; child-src blob:; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
/* 部分系统 WebView 会把百分比与 vh 都按 0 解析，导致 flex 画布只剩最小高度；这里的高度只作回退，实际由脚本按实测视口写入像素值。 */
body{height:100vh;display:flex;flex-direction:column;padding:12px;gap:10px;background:#f6f9f9;color:#182e2b;font:17px system-ui,sans-serif;overflow:hidden}
#message{flex:0 0 auto;max-height:120px;margin:0;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;overflow-y:auto}
#stage{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;border-radius:18px;background:#edf3f3}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
#actions{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:8px}
button{flex:1 1 100px;min-height:48px;padding:10px;border:1px solid #b1c9cb;border-radius:14px;background:#fff;color:#20596b;font:inherit;touch-action:manipulation}button:active{background:#d8e8eb}button:disabled{opacity:.55}
/* 游戏自绘界面时保留提示条给读屏，只在视觉上隐藏。 */
body[data-hud="off"] #message{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%)}
@media(prefers-color-scheme:dark){body{background:#182421;color:#e4efeb}#stage{background:#23332f}button{background:#2c403b;color:#edf8f4;border-color:#688a80}}
</style></head><body data-state="loading"><p id="message" role="status" aria-live="polite"></p><div id="stage"><canvas aria-label="小游戏互动场景"></canvas></div><div id="actions"></div>
<script>
// 生成代码仅拼接到Worker源码，不进入页面脚本或DOM；原生侧注入的是Base64数据。
const payload=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob('__PAYLOAD__'),c=>c.charCodeAt(0))));
const message=document.querySelector('#message'),actions=document.querySelector('#actions'),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),stage=document.querySelector('#stage');
let worker=null,timer=null,busy=false,commands=[],sx=1,sy=1,seq=0,finished=false,messages=0,windowStart=performance.now(),sessionTimer=null,dragging=false,lastMove=0;
message.textContent=payload.instructions;
// 部分系统 WebView 会把 vh/百分比高度按 0 解析，导致 flex 画布只剩内边距高；用实测视口高度写死像素值。
function fitHeight(){const h=document.documentElement.clientHeight||innerHeight;if(h>0)document.body.style.height=h+'px';}
fitHeight();
if(typeof ResizeObserver==='function')new ResizeObserver(fitHeight).observe(document.documentElement);else window.addEventListener('resize',fitHeight);
function fail(text){if(worker)worker.terminate();worker=null;clearTimeout(timer);clearTimeout(sessionTimer);busy=false;dragging=false;document.body.dataset.state='failed';message.textContent=text;actions.textContent='';}
function color(v){return typeof v==='string'&&/^#(?:[0-9a-f]{3}|[0-9a-f]{6})$/i.test(v)?v:'#276B91';}
function number(v,min,max){return typeof v==='number'&&Number.isFinite(v)?Math.max(min,Math.min(max,v)):min;}
// 画布铺满舞台：横纵各自换算，矩形与线随比例伸展，圆和文字按短边取尺度，避免被拉成椭圆。
function redraw(){
 const dpr=Math.min(devicePixelRatio||1,2),w=stage.clientWidth,h=stage.clientHeight;
 if(!w||!h)return;
 canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
 sx=w/100;sy=h/100;const s=Math.min(sx,sy);
 for(const c of commands){
  if(!Array.isArray(c))continue;const X=v=>number(v,-100,200)*sx,Y=v=>number(v,-100,200)*sy;ctx.save();
  if(c[0]==='text'){
   const size=Math.max(12,number(c[4],2,10)*s),align=c[6]==='center'?'center':c[6]==='right'?'right':'left';
   ctx.fillStyle=color(c[5]);ctx.font=size+'px system-ui,sans-serif';ctx.textAlign=align;ctx.textBaseline='middle';
   const limit=Math.max(20,w*1.4);ctx.fillText(String(c[1]).slice(0,160),X(c[2]),Y(c[3]),limit);
  }
  else if(c[0]==='rect'){
   const x=X(c[1]),y=Y(c[2]),rw=number(c[3],0,200)*sx,rh=number(c[4],0,200)*sy,r=number(c[6]||0,0,20)*s;
   ctx.fillStyle=color(c[5]);
   if(r>0){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,rw,rh,r):ctx.rect(x,y,rw,rh);ctx.fill();}else ctx.fillRect(x,y,rw,rh);
  }
  else if(c[0]==='circle'){ctx.fillStyle=color(c[4]);ctx.beginPath();ctx.arc(X(c[1]),Y(c[2]),number(c[3],0,100)*s,0,Math.PI*2);ctx.fill();}
  else if(c[0]==='line'){ctx.strokeStyle=color(c[5]);ctx.lineWidth=Math.max(.5,number(c[6],.2,4)*s);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(X(c[1]),Y(c[2]));ctx.lineTo(X(c[3]),Y(c[4]));ctx.stroke();}
  ctx.restore();
 }
}
// 一次只处理一个点击或按钮操作，超时计时器留在宿主页，Worker即使死循环也不能阻止它终止本局。
function dispatch(event){if(!worker||busy||finished)return;busy=true;seq++;event.token=seq;timer=setTimeout(()=>fail('小游戏响应超时，请点击上方重新开始。'),900);worker.postMessage(event);}
// 拖拽单独走通道：不占用忙碌标记，按约30次/秒合并移动，避免逐像素刷屏。
function sendPointer(phase,x,y){if(!worker||finished)return;worker.postMessage({type:'pointer',phase,x,y});}
const bootstrap=`'use strict';
const send=self.postMessage.bind(self),handlers={tap:null,action:null,pointer:null};
const game=Object.freeze({
 draw:commands=>send({type:'draw',commands}),
 say:text=>send({type:'say',text:String(text)}),
 buttons:items=>send({type:'buttons',items}),
 background:value=>send({type:'background',color:String(value)}),
 hud:show=>send({type:'hud',show:!!show}),
 onTap:fn=>handlers.tap=fn,
 onAction:fn=>handlers.action=fn,
 onPointer:fn=>handlers.pointer=fn,
 finish:text=>send({type:'finish',text:String(text)})
});
let downX=0,downY=0;
self.onmessage=e=>{
 try{
  const d=e.data;
  if(d.type==='pointer'){
   if(d.phase==='down'){downX=d.x;downY=d.y;}
   if(handlers.pointer)handlers.pointer({phase:d.phase,x:d.x,y:d.y});
   // 保留 onTap：按下与抬起几乎不动时视为点击，老游戏不用改写。
   if(d.phase==='up'&&handlers.tap&&Math.abs(d.x-downX)<3&&Math.abs(d.y-downY)<3)handlers.tap(d.x,d.y);
   return;
  }
  if(d.type==='tap'&&handlers.tap)handlers.tap(d.x,d.y);
  if(d.type==='action'&&handlers.action)handlers.action(d.id);
  send({type:'idle',token:d.token});
 }catch(error){send({type:'error'});}
};
`;
try{
 const blob=new Blob([bootstrap,'\ntry{\n',payload.code,'\nself.postMessage({type:"ready"});\n}catch(error){self.postMessage({type:"error"});}'],{type:'text/javascript'}),url=URL.createObjectURL(blob);
 worker=new Worker(url);URL.revokeObjectURL(url);sessionTimer=setTimeout(()=>fail('本局已结束，请点击上方重新开始。'),90000);busy=true;timer=setTimeout(()=>fail('小游戏未能启动，请点击上方重新开始。'),1800);
 worker.onerror=e=>{e.preventDefault();fail('小游戏运行出错，可关闭后请AI换一个小游戏。');};
 // 限制消息频率和长度，避免生成代码逐帧刷消息或提交超大绘图列表。
 worker.onmessage=e=>{
  const now=performance.now();if(now-windowStart>1000){windowStart=now;messages=0;}if(++messages>160){fail('小游戏更新过于频繁，请重新开始。');return;}
  const d=e.data;if(!d||typeof d!=='object')return;
  try{if(JSON.stringify(d).length>20000){fail('小游戏内容过多，请重新开始。');return;}}catch(error){fail('小游戏数据无效，请重新开始。');return;}
  if(d.type==='ready'||d.type==='idle'&&d.token===seq){clearTimeout(timer);busy=false;if(!finished)document.body.dataset.state='ready';}
  else if(d.type==='draw'&&Array.isArray(d.commands)){commands=d.commands.slice(0,160);redraw();}
  else if(d.type==='background'){const value=color(d.color);stage.style.background=value;}
  else if(d.type==='hud'){document.body.dataset.hud=d.show?'on':'off';}
  else if(d.type==='say'||d.type==='finish'){message.textContent=String(d.text).slice(0,400);if(d.type==='finish'){finished=true;document.body.dataset.state='finished';clearTimeout(timer);clearTimeout(sessionTimer);busy=false;dragging=false;actions.querySelectorAll('button').forEach(b=>b.disabled=true);worker.terminate();worker=null;}}
  else if(d.type==='buttons'&&Array.isArray(d.items)&&!finished){actions.textContent='';d.items.slice(0,6).forEach(item=>{if(!item||typeof item.id!=='string'||typeof item.label!=='string')return;const b=document.createElement('button');b.textContent=item.label.slice(0,24);b.onclick=()=>dispatch({type:'action',id:item.id.slice(0,40)});actions.appendChild(b);});}
  else if(d.type==='error')fail('小游戏运行出错，可关闭后请AI换一个小游戏。');
 };
}catch(error){fail('当前设备无法启动小游戏，请更新系统WebView后重试。');}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/(r.width/100),y:(e.clientY-r.top)/(r.height/100)};}
canvas.addEventListener('pointerdown',e=>{const p=point(e);dragging=true;try{canvas.setPointerCapture(e.pointerId);}catch(_){}sendPointer('down',p.x,p.y);});
canvas.addEventListener('pointermove',e=>{if(!dragging)return;const now=performance.now();if(now-lastMove<33)return;lastMove=now;const p=point(e);sendPointer('move',p.x,p.y);});
function release(e){if(!dragging)return;dragging=false;const p=point(e);sendPointer('up',p.x,p.y);}
canvas.addEventListener('pointerup',release);
canvas.addEventListener('pointercancel',release);
if(typeof ResizeObserver==='function')new ResizeObserver(redraw).observe(stage);else window.addEventListener('resize',redraw);
window.pauseGame=()=>fail('本局已暂停，请点击上方重新开始。');
</script></body></html>
